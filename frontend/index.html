<!doctype html>
<html lang="uk">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Живе табло</title>
        <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
        <style>
            :root {
                --bg: #14161a;
                --card: #1c1f26;
                --ink: #e8eaed;
                --dim: #9aa0a6;
                --ok: #7bc96f;
                --err: #ff6b6b;
                --line: #2c3039;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                padding: 24px 16px;
                background: var(--bg);
                color: var(--ink);
                font:
                    16px/1.5 system-ui,
                    -apple-system,
                    "Segoe UI",
                    sans-serif;
            }
            main {
                max-width: 760px;
                margin: 0 auto;
            }
            h1 {
                font-size: 22px;
                margin: 0 0 4px;
            }
            .meta {
                color: var(--dim);
                font-size: 14px;
                margin-bottom: 20px;
            }
            .bar {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                margin-bottom: 16px;
            }
            button {
                background: var(--card);
                color: var(--ink);
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 9px 14px;
                font-size: 14px;
                cursor: pointer;
            }
            button:hover {
                border-color: #3d434f;
            }
            .match {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 10px;
                padding: 12px 14px;
                margin-bottom: 8px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 12px;
            }
            .score {
                font-variant-numeric: tabular-nums;
                font-size: 20px;
                font-weight: 600;
            }
            .empty {
                color: var(--dim);
            }
            #log {
                margin-top: 20px;
                border-top: 1px solid var(--line);
                padding-top: 12px;
                font:
                    13px/1.6 ui-monospace,
                    SFMono-Regular,
                    Menlo,
                    monospace;
                white-space: pre-wrap;
                word-break: break-word;
            }
            .err {
                color: var(--err);
            }
            .ok {
                color: var(--ok);
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Живе табло турніру</h1>
            <p class="meta">
                Сторінка піднята на <code id="origin"></code>, API — на
                <code>http://127.0.0.1:8000</code>. Це
                <strong>різні origin</strong>, тому кожен запит нижче проходить
                через CORS.
            </p>

            <div class="bar">
                <button id="read">Читати табло (GET)</button>
                <button id="goal">Додати гол (POST + JSON)</button>
                <button id="header">Прочитати X-Live-Count</button>
                <button id="poll">Автооновлення: вимкнено</button>
            </div>

            <div id="board"><p class="empty">Натисніть «Читати табло».</p></div>
            <div id="log">
                Помилки й відповіді з'являться тут — і водночас у консолі
                браузера та на вкладці Network.
            </div>
        </main>

        <script>
            const API = "http://127.0.0.1:8000/api/v1";
            const board = document.getElementById("board");
            const logBox = document.getElementById("log");
            document.getElementById("origin").textContent = location.origin;

            let timer = null;
            let lastBoard = [];

            function log(message, kind) {
                const line = document.createElement("div");
                if (kind) line.className = kind;
                line.textContent =
                    new Date().toLocaleTimeString("uk-UA") + "  " + message;
                logBox.prepend(line);
            }

            /* Тонка обгортка: якщо axios не завантажився (немає інтернету в класі) —
   той самий код працює на fetch. Для CORS різниці немає жодної: обидва
   надсилають звичайний запит, і обидва нічого не можуть зробити з тим,
   що браузер приховає відповідь. */
            async function request(method, path, body) {
                const url = API + path;
                if (window.axios) {
                    const response = await axios({ method, url, data: body });
                    return {
                        data: response.data,
                        header: (n) => response.headers[n.toLowerCase()],
                    };
                }
                const response = await fetch(url, {
                    method,
                    headers: body ? { "Content-Type": "application/json" } : {},
                    body: body ? JSON.stringify(body) : undefined,
                });
                if (!response.ok) throw new Error("HTTP " + response.status);
                return {
                    data: await response.json(),
                    header: (n) => response.headers.get(n),
                };
            }

            function describe(error) {
                /* Найважливіше місце сторінки. Якщо CORS не налаштований, браузер не дає
     JS ні коду відповіді, ні тіла — лишається «Network Error». Це НЕ
     означає, що сервер не відповів: подивіться на вкладку Network і на
     лог runserver — запит там є. */
                if (error.response)
                    return (
                        "сервер відповів " +
                        error.response.status +
                        ": " +
                        JSON.stringify(error.response.data)
                    );
                return (
                    "запит не дійшов до JS: " +
                    error.message +
                    " — подивіться в консоль і на вкладку Network"
                );
            }

            async function readBoard() {
                try {
                    const { data } = await request("get", "/scoreboard/");
                    lastBoard = data;
                    render(data);
                    log("табло оновлено, матчів: " + data.length, "ok");
                } catch (error) {
                    board.innerHTML = '<p class="empty">Дані не прийшли.</p>';
                    log("GET /scoreboard/ — " + describe(error), "err");
                }
            }

            function render(matches) {
                if (!matches.length) {
                    board.innerHTML =
                        '<p class="empty">Жоден матч не триває. ' +
                        "Перевести матч у live можна через PATCH або адмінку.</p>";
                    return;
                }
                board.innerHTML = "";
                for (const match of matches) {
                    const row = document.createElement("div");
                    row.className = "match";
                    row.innerHTML =
                        "<span>" +
                        match.home_name +
                        " — " +
                        match.away_name +
                        "</span>" +
                        '<span class="score">' +
                        match.score.home +
                        ":" +
                        match.score.away +
                        "</span>";
                    board.appendChild(row);
                }
            }

            /* POST із тілом JSON — саме той запит, який НЕ є простим і тому змушує
   браузер спершу надіслати preflight OPTIONS. На GET вище preflight немає:
   порівняйте обидва на вкладці Network. */
            async function addGoal() {
                if (!lastBoard.length) {
                    log(
                        "спершу прочитайте табло: потрібен матч, що триває",
                        "err",
                    );
                    return;
                }
                const match = lastBoard[0];
                try {
                    await request("post", "/matches/" + match.id + "/events/", {
                        kind: "goal",
                        minute: 1 + Math.floor(Math.random() * 90),
                        player: "Гравець з браузера",
                        team: match.home,
                    });
                    log(
                        "гол доданий у матч " +
                            match.id +
                            " — дивіться OPTIONS у Network",
                        "ok",
                    );
                    readBoard();
                } catch (error) {
                    log("POST .../events/ — " + describe(error), "err");
                }
            }

            /* Кастомний заголовок приходить у відповіді завжди, але JS побачить його
   лише тоді, коли сервер перелічить його в CORS_EXPOSE_HEADERS. */
            async function readHeader() {
                try {
                    const { header } = await request("get", "/scoreboard/");
                    const value = header("X-Live-Count");
                    if (value === undefined || value === null) {
                        log(
                            "X-Live-Count = undefined — заголовок у відповіді є, але браузер " +
                                "не віддає його JS: додайте CORS_EXPOSE_HEADERS",
                            "err",
                        );
                    } else {
                        log("X-Live-Count = " + value, "ok");
                    }
                } catch (error) {
                    log("GET /scoreboard/ — " + describe(error), "err");
                }
            }

            document.getElementById("read").onclick = readBoard;
            document.getElementById("goal").onclick = addGoal;
            document.getElementById("header").onclick = readHeader;
            document.getElementById("poll").onclick = (event) => {
                if (timer) {
                    clearInterval(timer);
                    timer = null;
                    event.target.textContent = "Автооновлення: вимкнено";
                } else {
                    timer = setInterval(readBoard, 3000);
                    event.target.textContent = "Автооновлення: кожні 3 с";
                    readBoard();
                }
            };
        </script>
    </body>
</html>
